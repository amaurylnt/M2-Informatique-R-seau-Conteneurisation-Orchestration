apiVersion: v1
kind: Namespace
metadata:
  name: workshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-config
  namespace: workshop
data:
  BANNER_TEXT: "Hello M2 IR"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: workshop
type: Opaque
stringData:
  DB_USER: app
  DB_PASS: changeMe123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: workshop
  labels: { app: front }
spec:
  replicas: 2
  selector:
    matchLabels: { app: front }
  template:
    metadata:
      labels: { app: front }
    spec:
      containers:
        - name: front
          image: ghcr.io/nginxdemos/hello:plain-text
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BANNER_TEXT
              valueFrom:
                configMapKeyRef:
                  name: front-config
                  key: BANNER_TEXT
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: workshop
spec:
  selector: { app: front }
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: workshop
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: kennethreitz/httpbin
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_USER }
            - name: DB_PASS
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_PASS }
          readinessProbe:
            httpGet: { path: /get, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: workshop
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: http
---
# cert-manager : ClusterIssuer self-signed (lab)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: workshop
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: selfsigned
spec:
  tls:
    - hosts: ["workshop.local"]
      secretName: web-tls
  rules:
    - host: workshop.local
      http:
        paths:
          - path: /front
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
